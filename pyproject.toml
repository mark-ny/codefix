[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codefix"
version = "0.1.0"
description = "Safe, explainable Python code review, correction, refactoring and verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
ruff = ["ruff"]
black = ["black"]
pytest = ["pytest"]
libcst = ["libcst"]
all = ["ruff", "black", "pytest", "libcst"]
dev = ["pytest"]

[project.scripts]
codefix = "codefix.cli.main:main"
codefix-ui = "codefix.web.server:main"
"index.html" = "codefix.web.server:main"

[project.entry-points."codefix.rules"]
# Third-party plugins register here, see docs/plugin-development.md

[tool.hatch.build.targets.wheel]
packages = ["src/codefix"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "codefix/_knowledge"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
